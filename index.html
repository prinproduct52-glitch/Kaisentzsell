<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAISENTZ SELL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Siemreap&display=swap" rel="stylesheet">
    <style>
        /* រក្សាម៉ូត Design ចាស់ទាំងអស់ដដែល */
        body { margin: 0; padding: 0; background-color: #0ba2b8; font-family: 'Poppins', 'Siemreap', sans-serif; color: #000; overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #0ba2b8; border-bottom: 2px solid #000; position: relative; z-index: 10; }
        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; border: 2px solid #000; }
        .app-title { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; line-height: 1.1; }
        .app-subtitle { font-size: 20px; font-weight: 700; color: #000; text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5); }
        .menu-btn { display: flex; flex-direction: column; gap: 5px; background-color: #b3e5fc; border: 2px solid #000; border-radius: 10px; padding: 10px; cursor: pointer; box-shadow: 0px 4px 0px #000; }
        .menu-btn:active { transform: translateY(4px); box-shadow: 0px 0px 0px #000; }
        .menu-btn span { width: 25px; height: 3px; background-color: #000; border-radius: 2px; }

        /* Sidebar & Modal (រក្សាដដែល) */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; display: none; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .sidebar { position: fixed; top: 0; right: -280px; width: 260px; height: 100vh; background-color: #1a1b2e; z-index: 100; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.5); padding: 20px; box-sizing: border-box; color: #fff; }
        .sidebar.active { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #36395e; padding-bottom: 15px; margin-bottom: 20px; }
        .close-sidebar { font-size: 24px; cursor: pointer; color: #a3a5c2; }
        .sidebar-menu button { display: block; width: 100%; background-color: #272945; color: #fff; border: 1px solid #36395e; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 15px; font-family: 'Siemreap', sans-serif; text-align: left; cursor: pointer; }
        .sidebar-menu button:hover { background-color: #5d7aff; }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background-color: #1a1b2e; width: 90%; max-width: 350px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 110; display: none; opacity: 0; transition: all 0.3s ease; color: white; box-sizing: border-box; }
        .modal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-modal { font-size: 20px; cursor: pointer; color: #a3a5c2; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #8c8ea8; }
        .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #36395e; background-color: #121322; color: #fff; font-family: 'Poppins', sans-serif; box-sizing: border-box; outline: none; }
        .submit-btn { width: 100%; background-color: #4ade80; color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'Siemreap', sans-serif; }

        /* Admin Panel Styles */
        .admin-panel { display: none; background-color: #fff; padding: 15px; margin: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .admin-panel h3 { margin-top: 0; color: #e11d48; }
        
        /* Product Cards */
        .content { padding: 15px; }
        .button-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
        .btn-3d { background-color: #b3e5fc; border: 2px solid #000; border-radius: 25px; padding: 10px; font-weight: 700; cursor: pointer; box-shadow: 0px 5px 0px #000; display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
        .btn-3d:active { transform: translateY(5px); box-shadow: 0px 0px 0px #000; }
        
        .products-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .product-card { background-color: #1a1b2e; border-radius: 12px; width: 100%; max-width: 280px; overflow: hidden; color: #fff; }
        .product-image { width: 100%; height: 140px; object-fit: cover; }
        .product-content { padding: 12px; }
        .product-title { font-size: 15px; font-weight: 700; margin: 0 0 10px 0; }
        .product-footer { display: flex; gap: 8px; align-items: center; }
        .product-price { background-color: #121322; padding: 8px; border-radius: 10px; font-size: 15px; font-weight: 700; flex: 1; color: #4ade80; text-align: center; }
        .buy-btn { background-color: #5d7aff; color: #fff; border: none; padding: 8px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-section">
            <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" alt="Logo" class="logo-img">
            <div>
                <div class="app-title">KAISENTZ</div>
                <div class="app-subtitle">SELL</div>
            </div>
        </div>
        <div class="menu-btn" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 id="userDisplay">ភ្ញៀវ</h3>
            <span class="close-sidebar" onclick="toggleSidebar()">✖</span>
        </div>
        <div class="sidebar-menu">
            <button onclick="openLoginModal()">🔑 ចូលគណនី (Login)</button>
        </div>
    </div>

    <!-- ផ្ទាំង Login -->
    <div class="modal" id="loginModal">
        <div class="modal-header">
            <h3>ចូលគណនី</h3>
            <span class="close-modal" onclick="closeModals()">✖</span>
        </div>
        <div class="input-group">
            <label>USERNAME</label>
            <input type="text" id="loginUser" placeholder="ex: kaisentzsellvip">
        </div>
        <div class="input-group">
            <label>PASSWORD (ID)</label>
            <input type="password" id="loginPass" placeholder="ex: 77779">
        </div>
        <button class="submit-btn" onclick="processLogin()">ចូល</button>
    </div>

    <!-- ផ្ទាំង Admin Panel សម្រាប់ផុសទំនិញ (លាក់ទុក នឹងបង្ហាញពេល Admin Login) -->
    <div class="admin-panel" id="adminPanel">
        <h3>👑 Admin Panel: ផុសទំនិញថ្មី</h3>
        <div class="input-group">
            <label>Link រូបភាព (Image URL)</label>
            <input type="text" id="p_img" placeholder="ដាក់ Link រូបភាពទីនេះ..." style="border:1px solid #ccc; background:#fff; color:#000;">
        </div>
        <div class="input-group">
            <label>ឈ្មោះទំនិញ (Title)</label>
            <input type="text" id="p_title" placeholder="ឧ. LV 2807 + V3" style="border:1px solid #ccc; background:#fff; color:#000;">
        </div>
        <div class="input-group">
            <label>តម្លៃ (Price)</label>
            <input type="text" id="p_price" placeholder="ឧ. $1.25" style="border:1px solid #ccc; background:#fff; color:#000;">
        </div>
        <button class="submit-btn" style="background:#e11d48; color:#fff;" onclick="addNewProduct()">+ ផុសលក់ឥឡូវនេះ</button>
    </div>

    <div class="content">
        <div class="button-group">
            <button class="btn-3d" onclick="renderProducts()">BLOX FRUIT</button>
        </div>
        <!-- កន្លែងបង្ហាញទំនិញ (ទាញចេញពី JavaScript ស្វ័យប្រវត្តិ) -->
        <div class="products-container" id="productContainer"></div>
    </div>

    <script>
        // ១. ប្រព័ន្ធទិន្នន័យផលិតផល (ប្រើ LocalStorage ដើម្បីកុំឲ្យបាត់ពេល Refresh)
        let products = JSON.parse(localStorage.getItem('myProducts')) || [
            { img: 'https://img.sanishtech.com/u/2686cadce80ef1fdd79a01a6183e7017.png', title: '. LV 2807 + V3', price: '$1.25' }
        ];

        // ២. មុខងារបង្ហាញផលិតផល
        function renderProducts() {
            const container = document.getElementById("productContainer");
            container.innerHTML = ""; // លុបកូដចាស់
            
            products.forEach(p => {
                const card = `
                <div class="product-card">
                    <img src="${p.img}" class="product-image">
                    <div class="product-content">
                        <h3 class="product-title">${p.title}</h3>
                        <div class="product-footer">
                            <div class="product-price">${p.price}</div>
                            <button class="buy-btn">ទិញឥឡូវនេះ</button>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += card;
            });
        }
        
        // ហៅមុខងារបង្ហាញឲ្យចេញមកភ្លាមៗពេលបើកវេបសាយ
        renderProducts();

        // ៣. មុខងារ Admin បន្ថែមផលិតផលថ្មី
        function addNewProduct() {
            const img = document.getElementById('p_img').value;
            const title = document.getElementById('p_title').value;
            const price = document.getElementById('p_price').value;

            if(img && title && price) {
                products.push({ img, title, price });
                localStorage.setItem('myProducts', JSON.stringify(products)); // Save ចូលម៉ាស៊ីន
                renderProducts(); // Refresh ផ្ទាំងលក់
                alert("បានផុសទំនិញថ្មីដោយជោគជ័យ!");
                
                // Clear form
                document.getElementById('p_img').value = "";
                document.getElementById('p_title').value = "";
                document.getElementById('p_price').value = "";
            } else {
                alert("សូមបំពេញព័ត៌មានឲ្យគ្រប់គ្រាន់!");
            }
        }

        // ៤. ប្រព័ន្ធ Login & Sidebar 
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function openLoginModal() {
            toggleSidebar();
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function closeModals() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        // ៥. ពិនិត្យ Admin ពេលចុចចូល
        function processLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if(user === "kaisentzsellvip" && pass === "77779") {
                alert("សួស្តី Admin VIP 77779! អ្នកអាចផុសទំនិញបានហើយ។");
                document.getElementById('adminPanel').style.display = 'block'; // បង្ហាញកន្លែងផុស
                document.getElementById('userDisplay').innerText = "👑 KAISENTZ SELL VIP";
                closeModals();
            } else {
                alert("Username ឬ Password មិនត្រឹមត្រូវទេ!");
            }
        }
    </script>
</body>
</html>
