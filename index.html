<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAISENTZ SELL</title>
    <!-- Google Identity Services សម្រាប់ Login ជាមួយ Gmail -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* រចនាផ្ទៃទូទៅ */
        body {
            margin: 0;
            padding: 0;
            background-color: #0ba2b8; /* ពណ៌ផ្ទៃខាងក្រោយដូចក្នុងរូប */
            font-family: 'Arial', sans-serif;
            color: #000;
        }

        /* រចនាផ្នែកខាងលើ (Header) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #0ba2b8;
            border-bottom: 2px solid #000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            background-color: #000;
            border-radius: 10px;
            object-fit: cover;
        }

        .app-title {
            font-size: 22px;
            font-weight: 900;
            color: #fff; /* ពណ៌អក្សរ KAISENTZ */
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; /* ធ្វើឲ្យអក្សរមានគែមខ្មៅ */
            line-height: 1;
        }
        .app-subtitle {
            font-size: 20px;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 2px #fff;
        }

        /* រចនាប៊ូតុង 3D ទូទៅ */
        .btn-3d {
            background-color: #b3e5fc;
            border: 2px solid #000;
            border-radius: 20px;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0px 4px 0px #000; /* ស្រមោលធ្វើឲ្យមើលទៅដូច 3D */
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
        }

        /* ពេលចុចប៊ូតុងឲ្យវាផតចុះក្រោម */
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #000;
        }

        /* ប៊ូតុង Login ខាងលើ */
        .login-btn {
            background-color: #81d4fa;
            border-radius: 25px;
            padding: 5px 10px 5px 15px;
            font-size: 16px;
        }

        .login-btn span.plus-icon {
            background-color: #000;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        /* រចនាផ្នែកខាងក្រោម (Content) */
        .content {
            padding: 20px 15px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #000;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .game-btn {
            flex: 1;
            justify-content: center;
            background-color: #81d4fa;
            padding: 10px;
            font-size: 12px;
        }

        .roblox-icon {
            width: 18px;
            height: 18px;
            background-color: #1b5e20; /* ពណ៌តំណាង */
            border-radius: 3px;
        }
        
        /* កន្លែងលាក់ប៊ូតុង Google ដើម */
        #g_id_onload {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ផ្នែកខាងលើ (Header) -->
    <div class="header">
        <div class="logo-section">
            <!-- សូមប្តូរ Link រូបភាពនៅទីនេះ -->
            <img src="https://via.placeholder.com/50/000000/FFFFFF/?text=LOGO" alt="Logo" class="logo-img" id="appLogo">
            <div>
                <div class="app-title">KAISENTZ</div>
                <div class="app-subtitle">SELL</div>
            </div>
        </div>
        
        <!-- ប៊ូតុង Login ដែលយើងរចនា (វានឹងហៅមុខងារ Google Login ពេលចុច) -->
        <button class="btn-3d login-btn" onclick="triggerGoogleLogin()">
            Login <span class="plus-icon">+</span>
        </button>
    </div>

    <!-- ផ្នែកកណ្តាល (Account For Sell) -->
    <div class="content">
        <div class="section-title">🎮 Account For sell</div>
        
        <div class="button-group">
            <button class="btn-3d game-btn">
                <div class="roblox-icon" style="background-color: #0d47a1;"></div> BLOX FRUIT
            </button>
            <button class="btn-3d game-btn">
                <div class="roblox-icon" style="background-color: #0d47a1;"></div> STEAL AN EGG
            </button>
        </div>
    </div>

    <!-- កូដសម្រាប់ Google Login (ទាមទារ Client ID) -->
    <!-- សូមប្តូរ YOUR_GOOGLE_CLIENT_ID_HERE ទៅជា Client ID របស់អ្នកពិតប្រាកដ -->
    <div id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <script>
        // មុខងារសម្រាប់ដំណើរការការ Login ជាមួយ Google ពេលចុចប៊ូតុង 3D របស់យើង
        function triggerGoogleLogin() {
            google.accounts.id.prompt(); 
        }

        // មុខងារនេះនឹងដំណើរការនៅពេល User បាន Login ជោគជ័យ
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            alert("អ្នកបាន Login ដោយជោគជ័យ ជាមួយគណនី Gmail!");
            
            // អ្នកអាចសរសេរកូដបន្ថែមនៅទីនេះ ដើម្បីបញ្ជូន Token ទៅកាន់ Server របស់អ្នក
            document.querySelector('.login-btn').innerHTML = 'Logged In ✓';
            document.querySelector('.login-btn').style.backgroundColor = '#a5d6a7';
        }
    </script>
</body>
</html>
