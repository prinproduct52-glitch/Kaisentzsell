<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAISENTZ SELL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Siemreap&display=swap" rel="stylesheet">
    <style>
        /* រក្សាម៉ូត Design ទូទៅ */
        body { margin: 0; padding: 0; background-color: #0ba2b8; font-family: 'Poppins', 'Siemreap', sans-serif; color: #000; overflow-x: hidden; }
        @keyframes pulseInOut { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes fallDown { 0% { transform: translateY(-100px) rotate(0deg); opacity: 0.8; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; } }
        .falling-logo { position: fixed; top: -60px; width: 35px; height: 35px; border-radius: 8px; z-index: 1; pointer-events: none; animation: fallDown linear infinite; }
        .falling-logo:nth-child(1) { left: 5%; animation-duration: 8s; animation-delay: 0s; }
        .falling-logo:nth-child(2) { left: 15%; animation-duration: 12s; animation-delay: 2s; }
        .falling-logo:nth-child(3) { left: 25%; animation-duration: 9s; animation-delay: 4s; }
        .falling-logo:nth-child(4) { left: 35%; animation-duration: 11s; animation-delay: 1s; }
        .falling-logo:nth-child(5) { left: 45%; animation-duration: 10s; animation-delay: 3s; }
        .falling-logo:nth-child(6) { left: 55%; animation-duration: 13s; animation-delay: 0.5s; }
        .falling-logo:nth-child(7) { left: 65%; animation-duration: 9.5s; animation-delay: 2.5s; }
        .falling-logo:nth-child(8) { left: 75%; animation-duration: 11.5s; animation-delay: 1.5s; }
        .falling-logo:nth-child(9) { left: 85%; animation-duration: 10.5s; animation-delay: 3.5s; }
        .falling-logo:nth-child(10) { left: 95%; animation-duration: 14s; animation-delay: 0.2s; }
        .roblox-icon { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; animation: pulseInOut 1.2s infinite ease-in-out; }

        /* Header & Sidebar */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #0ba2b8; border-bottom: 2px solid #000; position: relative; z-index: 10; }
        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; border: 2px solid #000; }
        .app-title { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; line-height: 1.1; }
        .app-subtitle { font-size: 20px; font-weight: 700; color: #000; text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5); }
        .menu-btn { display: flex; flex-direction: column; gap: 5px; background-color: #b3e5fc; border: 2px solid #000; border-radius: 10px; padding: 10px; cursor: pointer; box-shadow: 0px 4px 0px #000; }
        .menu-btn:active { transform: translateY(4px); box-shadow: 0px 0px 0px #000; }
        .menu-btn span { width: 25px; height: 3px; background-color: #000; border-radius: 2px; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; display: none; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background-color: #1a1b2e; z-index: 100; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.5); padding: 20px; box-sizing: border-box; color: #fff; overflow-y: auto; }
        .sidebar.active { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #36395e; padding-bottom: 15px; margin-bottom: 15px; }
        .close-sidebar { font-size: 24px; cursor: pointer; color: #a3a5c2; }
        
        /* Profile Details Box ថ្មី */
        .profile-box { background-color: #272945; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #36395e; display: none; }
        .profile-name { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
        .profile-sub { font-size: 12px; color: #8c8ea8; }
        .profile-id { font-size: 12px; color: #4ade80; font-weight: bold; margin-bottom: 10px; }
        .profile-balance { font-size: 20px; font-weight: 900; color: #ffeb3b; }

        .sidebar-menu button { display: block; width: 100%; background-color: #272945; color: #fff; border: 1px solid #36395e; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 15px; font-family: 'Siemreap', sans-serif; text-align: left; cursor: pointer; transition: 0.2s; }
        .sidebar-menu button:hover { background-color: #5d7aff; }

        /* Modals & Content */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background-color: #1a1b2e; width: 90%; max-width: 380px; max-height: 85vh; overflow-y: auto; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 110; display: none; opacity: 0; transition: all 0.3s ease; color: white; box-sizing: border-box; }
        .modal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #36395e; padding-bottom: 10px; }
        .close-modal { font-size: 20px; cursor: pointer; color: #a3a5c2; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #8c8ea8; font-family: 'Siemreap'; }
        .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #36395e; background-color: #121322; color: #fff; font-family: 'Poppins', sans-serif; box-sizing: border-box; outline: none; }
        .submit-btn { width: 100%; background-color: #4ade80; color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'Siemreap', sans-serif; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 5px;}

        .admin-panel { display: none; background-color: #fff; padding: 15px; margin: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-family: 'Siemreap'; }
        .admin-panel h3 { margin-top: 0; color: #e11d48; margin-bottom: 15px; }
        .admin-divider { border-top: 1px solid #eee; margin: 20px 0; }
        
        .content { padding: 15px; position: relative; z-index: 10; }
        .button-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
        .btn-3d { background-color: #b3e5fc; border: 2px solid #000; border-radius: 25px; padding: 10px; font-weight: 700; cursor: pointer; box-shadow: 0px 5px 0px #000; display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
        .btn-3d:active { transform: translateY(5px); box-shadow: 0px 0px 0px #000; }
        
        .products-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .product-card { background-color: #1a1b2e; border-radius: 12px; width: 100%; max-width: 280px; overflow: hidden; color: #fff; }
        .product-image { width: 100%; height: 140px; object-fit: cover; }
        .product-content { padding: 12px; }
        .product-title { font-size: 15px; font-weight: 700; margin: 0 0 10px 0; }
        .product-footer { display: flex; gap: 8px; align-items: center; }
        .product-price { background-color: #121322; padding: 8px; border-radius: 10px; font-size: 15px; font-weight: 700; flex: 1; color: #4ade80; text-align: center; }
        .buy-btn { background-color: #5d7aff; color: #fff; border: none; padding: 8px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; font-family: 'Siemreap'; transition: 0.2s;}
        .buy-btn:hover { background-color: #4b66df; }

        .order-item { display: flex; align-items: center; gap: 10px; background: #272945; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .order-item img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
        .order-item div { flex: 1; }
        .order-item h4 { margin: 0; font-size: 14px; }
        .order-item p { margin: 0; color: #4ade80; font-weight: bold; font-size: 12px; }

        /* Chat System */
        .chat-box { display: flex; flex-direction: column; height: 400px; }
        .chat-messages { flex: 1; overflow-y: auto; background: #121322; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .msg-bubble { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 13px; word-wrap: break-word; }
        .msg-admin { align-self: flex-start; background-color: #36395e; color: #fff; border-bottom-left-radius: 0; }
        .msg-user { align-self: flex-end; background-color: #5d7aff; color: #fff; border-bottom-right-radius: 0; }
        .msg-sender { font-size: 10px; opacity: 0.7; margin-bottom: 3px; display: block; }
        .msg-image { max-width: 100%; border-radius: 5px; margin-top: 5px; }
        .msg-audio { max-width: 200px; margin-top: 5px; height: 35px; }
        .chat-input-area { display: flex; gap: 8px; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #272945; color: #fff; outline: none; }
        .chat-icon-btn { background: #36395e; color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; }
        .chat-icon-btn.recording { background: #e11d48; animation: pulseInOut 1s infinite; }
    </style>
</head>
<body>

    <!-- Logo Profile ធ្លាក់ -->
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo"><img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">

    <div class="header">
        <div class="logo-section">
            <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" alt="Logo" class="logo-img">
            <div>
                <div class="app-title">KAISENTZ</div>
                <div class="app-subtitle">SELL</div>
            </div>
        </div>
        <div class="menu-btn" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 id="userDisplayHeader">ភ្ញៀវ</h3>
            <span class="close-sidebar" onclick="toggleSidebar()">✖</span>
        </div>

        <!-- ផ្ទាំងព័ត៌មានគណនី (លាក់ទុក នឹងបង្ហាញពេល Login ចូល) -->
        <div class="profile-box" id="profileBox">
            <div class="profile-name" id="p_name">Name</div>
            <div class="profile-sub">@<span id="p_username">username</span></div>
            <div class="profile-id">ID: <span id="p_id">KZN-000000</span></div>
            <div class="profile-sub">ទឹកប្រាក់ (Balance):</div>
            <div class="profile-balance">$<span id="p_balance">0.00</span></div>
        </div>

        <div class="sidebar-menu">
            <button onclick="openModal('registerModal')" id="btnReg">📝 បង្កើតគណនី</button>
            <button onclick="openModal('loginModal')" id="btnLogin">🔑 ចូលគណនី (Login)</button>
            <button onclick="logout()" id="btnLogout" style="display:none; background:#e11d48;">🚪 ចាកចេញ</button>
            <button onclick="openOrderHistory()">🛒 ប្រវត្តិបញ្ជាទិញ</button>
            <button onclick="openChatModal()" style="background:#5d7aff;">💬 ឆាតទាក់ទង Admin</button>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="registerModal">
        <div class="modal-header"><h3>បង្កើតគណនីថ្មី</h3><span class="close-modal" onclick="closeModals()">✖</span></div>
        <div class="input-group"><label>ឈ្មោះពិត (NAME)</label><input type="text" id="regName"></div>
        <div class="input-group"><label>ឈ្មោះគណនី (USERNAME)</label><input type="text" id="regUsername"></div>
        <div class="input-group"><label>លេខសម្ងាត់ (PASSWORD)</label><input type="password" id="regPassword"></div>
        <button class="submit-btn" onclick="registerUser()">ចុះឈ្មោះ</button>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-header"><h3>ចូលគណនី</h3><span class="close-modal" onclick="closeModals()">✖</span></div>
        <div class="input-group"><label>USERNAME</label><input type="text" id="loginUser"></div>
        <div class="input-group"><label>PASSWORD</label><input type="password" id="loginPass"></div>
        <button class="submit-btn" onclick="processLogin()">ចូល</button>
    </div>

    <div class="modal" id="orderModal">
        <div class="modal-header"><h3>🛒 ប្រវត្តិបញ្ជាទិញរបស់អ្នក</h3><span class="close-modal" onclick="closeModals()">✖</span></div>
        <div id="orderListContainer" style="max-height: 300px; overflow-y: auto;"></div>
    </div>

    <div class="modal" id="chatModal">
        <div class="modal-header"><h3>💬 ជំនួយការអតិថិជន</h3><span class="close-modal" onclick="closeModals()">✖</span></div>
        <div class="chat-box">
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-area">
                <input type="file" id="imageUpload" accept="image/*" style="display:none;" onchange="sendImage(event)">
                <button class="chat-icon-btn" onclick="document.getElementById('imageUpload').click()">📷</button>
                <input type="text" id="chatInputText" placeholder="វាយសារទីនេះ...">
                <button class="chat-icon-btn" id="micBtn" onclick="toggleVoiceRecord()">🎤</button>
                <button class="chat-icon-btn" style="background:#4ade80; color:#000;" onclick="sendTextMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel (មានទាំងផុសទំនិញ និងគ្រប់គ្រងលុយ) -->
    <div class="admin-panel" id="adminPanel">
        <h3>👑 Admin Panel</h3>
        
        <!-- ផ្នែកទី១៖ ផុសទំនិញ -->
        <div style="font-weight:bold; margin-bottom:10px;">📦 ផុសទំនិញថ្មី</div>
        <div class="input-group"><label>Link រូបភាព</label><input type="text" id="ap_img" style="border:1px solid #ccc; background:#fff; color:#000;"></div>
        <div class="input-group"><label>ចំណងជើង</label><input type="text" id="ap_title" style="border:1px solid #ccc; background:#fff; color:#000;"></div>
        <div class="input-group"><label>តម្លៃ (ឧ. $1.25)</label><input type="text" id="ap_price" style="border:1px solid #ccc; background:#fff; color:#000;"></div>
        <button class="submit-btn" style="background:#36395e; color:#fff;" onclick="addNewProduct()">+ ផុសលក់ឥឡូវនេះ</button>

        <div class="admin-divider"></div>

        <!-- ផ្នែកទី២៖ គ្រប់គ្រងទឹកប្រាក់ (Balance) -->
        <div style="font-weight:bold; margin-bottom:10px;">💰 គ្រប់គ្រងទឹកប្រាក់ User</div>
        <div class="input-group"><label>លេខសម្គាល់គណនី (User ID)</label><input type="text" id="targetUserID" placeholder="ឧ. KZN-123456" style="border:1px solid #ccc; background:#fff; color:#000;"></div>
        <div class="input-group"><label>ចំនួនទឹកប្រាក់ ($)</label><input type="number" id="balanceAmount" placeholder="0.00" style="border:1px solid #ccc; background:#fff; color:#000;"></div>
        <div style="display: flex; gap: 10px;">
            <button class="submit-btn" style="background:#4ade80; color:#000;" onclick="manageBalance('add')">+ ដាក់ប្រាក់</button>
            <button class="submit-btn" style="background:#e11d48; color:#fff;" onclick="manageBalance('deduct')">- ដកប្រាក់</button>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content">
        <div class="button-group">
            <button class="btn-3d" onclick="renderProducts()">
                <img src="https://img.sanishtech.com/u/fdd6da2d2e64441fb845d71317b85d5d.jpeg" class="roblox-icon" alt="Roblox"> BLOX FRUIT
            </button>
        </div>
        <div class="products-container" id="productContainer"></div>
    </div>

    <script>
        // Database
        let products = JSON.parse(localStorage.getItem('myProducts')) || [{ img: 'https://img.sanishtech.com/u/2686cadce80ef1fdd79a01a6183e7017.png', title: '. LV 2807 + V3', price: '$1.25' }];
        let users = JSON.parse(localStorage.getItem('myUsers')) || [];
        let globalChats = JSON.parse(localStorage.getItem('myChats')) || [];
        let currentUser = null;

        // បង្ហាញទំនិញ និងមុខងារទិញកាត់លុយ
        function renderProducts() {
            const container = document.getElementById("productContainer");
            container.innerHTML = ""; 
            products.forEach((p, index) => {
                container.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" class="product-image">
                    <div class="product-content">
                        <h3 class="product-title">${p.title}</h3>
                        <div class="product-footer">
                            <div class="product-price">${p.price}</div>
                            <button class="buy-btn" onclick="buyProduct(${index})">ទិញឥឡូវនេះ</button>
                        </div>
                    </div>
                </div>`;
            });
        }
        renderProducts();

        function buyProduct(index) {
            if (!currentUser) { alert("សូមចូលគណនី (Login) ជាមុនសិន ទើបអាចទិញបាន។"); openModal('loginModal'); return; }
            if (currentUser.role === 'admin') { alert("Admin មិនអាចទិញទំនិញខ្លួនឯងបានទេ!"); return; }

            let product = products[index];
            // បម្លែងអក្សរឧទាហរណ៍ "$1.25" ទៅជាលេខ 1.25 ដើម្បីងាយស្រួលគណនា
            let priceNum = parseFloat(product.price.replace(/[^0-9.]/g, '')); 
            
            if(isNaN(priceNum)) priceNum = 0; // បើអត់មានតម្លៃលេខ

            if ((currentUser.balance || 0) < priceNum) {
                alert(`ទឹកប្រាក់របស់អ្នកមិនគ្រប់គ្រាន់ទេ! អ្នកត្រូវការ $${priceNum} ប៉ុន្តែអ្នកមានត្រឹមតែ $${currentUser.balance || 0}។\n\nសូមឆាតទៅកាន់ Admin ដើម្បីបញ្ជូលទឹកប្រាក់បន្ថែម!`);
                return;
            }

            // កាត់លុយ និងរក្សាទុកប្រវត្តិទិញ
            currentUser.balance -= priceNum;
            currentUser.orders = currentUser.orders || [];
            currentUser.orders.push(product);

            // Update ចូល Database
            let userIndex = users.findIndex(u => u.username === currentUser.username);
            users[userIndex] = currentUser;
            localStorage.setItem('myUsers', JSON.stringify(users));
            
            updateProfileUI(); // Refresh ឲ្យលោតលុយថ្មីក្នុង Profile
            alert("🎉 អបអរសាទរ! អ្នកបានបញ្ជាទិញជោគជ័យ។ ទឹកប្រាក់ត្រូវបានកាត់ចេញពីគណនីរបស់អ្នក។");
        }

        function openOrderHistory() {
            if(!currentUser || currentUser.role === 'admin') { alert("សូម Login គណនីអតិថិជនជាមុនសិន!"); return; }
            const container = document.getElementById("orderListContainer");
            container.innerHTML = "";
            if(!currentUser.orders || currentUser.orders.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#8c8ea8;'>អ្នកមិនទាន់មានប្រវត្តិទិញនៅឡើយទេ!</p>";
            } else {
                currentUser.orders.forEach(order => {
                    container.innerHTML += `<div class="order-item"><img src="${order.img}"><div><h4>${order.title}</h4><p>${order.price}</p></div></div>`;
                });
            }
            openModal('orderModal');
        }

        // Sidebar & UI Update
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); document.getElementById('sidebarOverlay').classList.remove('active'); document.getElementById('sidebar').classList.remove('active'); }
        function openModal(modalId) { toggleSidebar(); document.getElementById(modalId).classList.add('active'); document.getElementById('sidebarOverlay').classList.add('active'); }

        // Update UI របស់ Profile បន្ទាប់ពី Login ឬកាត់លុយ
        function updateProfileUI() {
            if(currentUser && currentUser.role === 'user') {
                document.getElementById('userDisplayHeader').style.display = 'none';
                document.getElementById('profileBox').style.display = 'block';
                document.getElementById('p_name').innerText = currentUser.name;
                document.getElementById('p_username').innerText = currentUser.username;
                document.getElementById('p_id').innerText = currentUser.id;
                document.getElementById('p_balance').innerText = parseFloat(currentUser.balance || 0).toFixed(2);
                
                document.getElementById('btnReg').style.display = 'none';
                document.getElementById('btnLogin').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'block';
            } else if (currentUser && currentUser.role === 'admin') {
                document.getElementById('userDisplayHeader').style.display = 'block';
                document.getElementById('userDisplayHeader').innerText = "👑 Admin VIP";
                document.getElementById('profileBox').style.display = 'none';
                
                document.getElementById('btnReg').style.display = 'none';
                document.getElementById('btnLogin').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'block';
            } else {
                document.getElementById('userDisplayHeader').style.display = 'block';
                document.getElementById('userDisplayHeader').innerText = "ភ្ញៀវ";
                document.getElementById('profileBox').style.display = 'none';
                
                document.getElementById('btnReg').style.display = 'block';
                document.getElementById('btnLogin').style.display = 'block';
                document.getElementById('btnLogout').style.display = 'none';
            }
        }

        // Auth
        function registerUser() {
            const name = document.getElementById('regName').value, username = document.getElementById('regUsername').value, pass = document.getElementById('regPassword').value;
            if(!name || !username || !pass) { alert("សូមបំពេញឲ្យគ្រប់គ្រាន់!"); return; }
            if(users.find(u => u.username === username)) { alert("Username នេះមានគេប្រើហើយ!"); return; }
            
            // បង្កើត ID ស្វ័យប្រវត្តិ និងកំណត់លុយ = 0
            const id = 'KZN-' + Math.floor(100000 + Math.random() * 900000);
            users.push({ name, username, pass, id, role: 'user', balance: 0, orders: [] });
            localStorage.setItem('myUsers', JSON.stringify(users));
            alert("បង្កើតគណនីបានជោគជ័យ! លេខ ID របស់អ្នកគឺ: " + id); closeModals();
        }

        function processLogin() {
            const user = document.getElementById('loginUser').value, pass = document.getElementById('loginPass').value;
            if(user === "kaisentzsellvip" && pass === "77779") {
                currentUser = { name: 'Admin VIP', username: user, role: 'admin' };
                document.getElementById('adminPanel').style.display = 'block';
                updateProfileUI(); closeModals();
                alert("សួស្តី Admin! អ្នកចូលប្រើប្រព័ន្ធបានជោគជ័យ។"); return;
            }

            const foundUser = users.find(u => u.username === user && u.pass === pass);
            if(foundUser) {
                currentUser = foundUser;
                document.getElementById('adminPanel').style.display = 'none';
                updateProfileUI(); closeModals();
            } else { alert("មិនមានគណនីនេះទេ!"); }
        }

        function logout() {
            currentUser = null;
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginUser').value = ""; document.getElementById('loginPass').value = "";
            updateProfileUI(); toggleSidebar(); alert("បានចាកចេញពីគណនី!"); 
        }

        // Admin មុខងារ (ផុស និង បញ្ចូលលុយ)
        function addNewProduct() {
            const img = document.getElementById('ap_img').value, title = document.getElementById('ap_title').value, price = document.getElementById('ap_price').value;
            if(img && title && price) {
                products.push({ img, title, price });
                localStorage.setItem('myProducts', JSON.stringify(products));
                renderProducts(); alert("បានផុសដោយជោគជ័យ!");
                document.getElementById('ap_img').value = ""; document.getElementById('ap_title').value = ""; document.getElementById('ap_price').value = "";
            }
        }

        function manageBalance(action) {
            let targetId = document.getElementById('targetUserID').value.trim();
            let amount = parseFloat(document.getElementById('balanceAmount').value);

            if(!targetId || isNaN(amount) || amount <= 0) { alert("សូមបញ្ចូលលេខ ID និងចំនួនទឹកប្រាក់ឲ្យបានត្រឹមត្រូវ!"); return; }

            let userIndex = users.findIndex(u => u.id === targetId);
            if(userIndex === -1) { alert("រកមិនឃើញគណនីដែលមាន ID នេះទេ!"); return; }

            if(action === 'add') {
                users[userIndex].balance = (users[userIndex].balance || 0) + amount;
                alert(`បានដាក់ប្រាក់ $${amount} ចូលគណនីរបស់ ${users[userIndex].name} ដោយជោគជ័យ!`);
            } else if (action === 'deduct') {
                if((users[userIndex].balance || 0) < amount) { alert("ទឹកប្រាក់ក្នុងគណនីអតិថិជននេះមិនមានគ្រប់គ្រាន់សម្រាប់ដកទេ!"); return; }
                users[userIndex].balance -= amount;
                alert(`បានដកប្រាក់ $${amount} ពីគណនីរបស់ ${users[userIndex].name} ដោយជោគជ័យ!`);
            }
            
            localStorage.setItem('myUsers', JSON.stringify(users));
            document.getElementById('targetUserID').value = ""; document.getElementById('balanceAmount').value = "";
        }

        // Chat System (សង្ខេប)
        function openChatModal() { if(!currentUser) { alert("សូម Login ជាមុនសិន!"); return; } openModal('chatModal'); renderChatMessages(); }
        function renderChatMessages() {
            const box = document.getElementById("chatBox"); box.innerHTML = "";
            globalChats.forEach(msg => {
                let isMe = (msg.sender === currentUser.username);
                let contentHtml = msg.type === 'text' ? msg.content : (msg.type === 'image' ? `<img src="${msg.content}" class="msg-image">` : `<audio controls class="msg-audio" src="${msg.content}"></audio>`);
                box.innerHTML += `<div class="msg-bubble ${isMe ? 'msg-user' : 'msg-admin'}"><span class="msg-sender">${isMe ? 'អ្នក' : (msg.role === 'admin' ? '👑 Admin' : msg.sender)}</span>${contentHtml}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        }
        function saveMessage(content, type) {
            globalChats.push({ sender: currentUser.username, role: currentUser.role, type: type, content: content });
            localStorage.setItem('myChats', JSON.stringify(globalChats)); renderChatMessages();
        }
        function sendTextMessage() { let input = document.getElementById("chatInputText"); if(input.value.trim() !== "") { saveMessage(input.value, 'text'); input.value = ""; } }
        function sendImage(event) { let file = event.target.files[0]; if(file) { let r = new FileReader(); r.onload = e => saveMessage(e.target.result, 'image'); r.readAsDataURL(file); } }
        
        let mediaRecorder, audioChunks = [];
        async function toggleVoiceRecord() {
            let micBtn = document.getElementById('micBtn');
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const reader = new FileReader(); reader.onloadend = () => saveMessage(reader.result, 'audio');
                        reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' })); audioChunks = [];
                    };
                    mediaRecorder.start(); micBtn.classList.add('recording');
                } catch (err) { alert("មិនអាចថតសំឡេងបានទេ! សូមបើកសិទ្ធិ Microphone។"); }
            } else { mediaRecorder.stop(); micBtn.classList.remove('recording'); }
        }
    </script>
