<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Siemreap&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0ba2b8; /* ពណ៌ Background ខាងក្រៅបណ្តោះអាសន្ន */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', 'Siemreap', sans-serif;
        }

        .product-card {
            background-color: #1a1b2e; /* ពណ៌ផ្ទៃកាតងងឹត */
            border-radius: 12px;
            width: 350px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .product-content {
            padding: 16px;
        }

        .badges {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge {
            background-color: #272945;
            color: #a3a5c2;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #36395e;
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .product-subtitle {
            font-size: 12px;
            color: #8c8ea8;
            margin: 0 0 20px 0;
            text-transform: uppercase;
        }

        .product-footer {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .product-price {
            background-color: #121322;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            border: 1px solid #272945;
            color: #4ade80; /* ប្តូរពណ៌តម្លៃឲ្យលេចធ្លោ (ពណ៌បៃតងខ្ចី) */
        }

        .buy-btn {
            background-color: #5d7aff;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
            font-family: 'Siemreap', sans-serif;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background-color: #4b66df;
        }

        .buy-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <!-- ដាក់ Link រូបភាពគណនី (Account) នៅទីនេះ -->
        <img src="https://img.sanishtech.com/u/2686cadce80ef1fdd79a01a6183e7017.png" alt="Game Account" class="product-image">
        
        <div class="product-content">
            <div class="badges">
                <span class="badge">ស្តុក: 1</span>
                <span class="badge">បានលក់: 177</span>
                <span class="badge">ធានា: 99 ថ្ងៃ</span>
            </div>
            
            <!-- ចំណងជើង Account (Caption) -->
            <h3 class="product-title">. LV 2807 + V3</h3>
            <p class="product-subtitle">BLOX FRUIT</p> <!-- ខ្ញុំបានដាក់ BLOX FRUIT ជាឧទាហរណ៍ -->
            
            <div class="product-footer">
                <!-- តម្លៃ (Price) -->
                <div class="product-price">$1.25</div>
                <button class="buy-btn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                    ទិញឥឡូវនេះ
                </button>
            </div>
        </div>
    </div>

</body>
</html>
