<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAISENTZ SELL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Siemreap&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #0ba2b8; font-family: 'Poppins', 'Siemreap', sans-serif; color: #000; overflow-x: hidden; }
        
        /* ចលនា Logo Roblox ផុស */
        @keyframes pulseInOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); } 
            100% { transform: scale(1); }
        }
        
        /* ចលនា Logo ធ្លាក់ពីលើចុះក្រោម */
        @keyframes fallDown {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
        }

        .falling-logo {
            position: fixed;
            top: -60px;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            z-index: 1; /* នៅក្រោយ Content */
            pointer-events: none; /* មិនរំខានការចុច */
            animation: fallDown linear infinite;
        }

        /* កំណត់ទីតាំង និងល្បឿនធ្លាក់សម្រាប់ Logo ទាំង ១០ */
        .falling-logo:nth-child(1) { left: 5%; animation-duration: 8s; animation-delay: 0s; }
        .falling-logo:nth-child(2) { left: 15%; animation-duration: 12s; animation-delay: 2s; }
        .falling-logo:nth-child(3) { left: 25%; animation-duration: 9s; animation-delay: 4s; }
        .falling-logo:nth-child(4) { left: 35%; animation-duration: 11s; animation-delay: 1s; }
        .falling-logo:nth-child(5) { left: 45%; animation-duration: 10s; animation-delay: 3s; }
        .falling-logo:nth-child(6) { left: 55%; animation-duration: 13s; animation-delay: 0.5s; }
        .falling-logo:nth-child(7) { left: 65%; animation-duration: 9.5s; animation-delay: 2.5s; }
        .falling-logo:nth-child(8) { left: 75%; animation-duration: 11.5s; animation-delay: 1.5s; }
        .falling-logo:nth-child(9) { left: 85%; animation-duration: 10.5s; animation-delay: 3.5s; }
        .falling-logo:nth-child(10) { left: 95%; animation-duration: 14s; animation-delay: 0.2s; }

        .roblox-icon { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; animation: pulseInOut 1.2s infinite ease-in-out; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #0ba2b8; border-bottom: 2px solid #000; position: relative; z-index: 10; }
        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; border: 2px solid #000; }
        .app-title { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; line-height: 1.1; }
        .app-subtitle { font-size: 20px; font-weight: 700; color: #000; text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5); }
        .menu-btn { display: flex; flex-direction: column; gap: 5px; background-color: #b3e5fc; border: 2px solid #000; border-radius: 10px; padding: 10px; cursor: pointer; box-shadow: 0px 4px 0px #000; }
        .menu-btn:active { transform: translateY(4px); box-shadow: 0px 0px 0px #000; }
        .menu-btn span { width: 25px; height: 3px; background-color: #000; border-radius: 2px; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; display: none; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .sidebar { position: fixed; top: 0; right: -280px; width: 260px; height: 100vh; background-color: #1a1b2e; z-index: 100; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.5); padding: 20px; box-sizing: border-box; color: #fff; }
        .sidebar.active { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #36395e; padding-bottom: 15px; margin-bottom: 20px; }
        .close-sidebar { font-size: 24px; cursor: pointer; color: #a3a5c2; }
        .sidebar-menu button, .sidebar-menu a { display: block; width: 100%; background-color: #272945; color: #fff; border: 1px solid #36395e; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 15px; font-family: 'Siemreap', sans-serif; text-align: left; cursor: pointer; text-decoration: none; }
        .sidebar-menu button:hover, .sidebar-menu a:hover { background-color: #5d7aff; }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background-color: #1a1b2e; width: 90%; max-width: 350px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 110; display: none; opacity: 0; transition: all 0.3s ease; color: white; box-sizing: border-box; }
        .modal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-modal { font-size: 20px; cursor: pointer; color: #a3a5c2; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #8c8ea8; }
        .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #36395e; background-color: #121322; color: #fff; font-family: 'Poppins', sans-serif; box-sizing: border-box; outline: none; }
        .submit-btn { width: 100%; background-color: #4ade80; color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'Siemreap', sans-serif; }

        .admin-panel { display: none; background-color: #fff; padding: 15px; margin: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .admin-panel h3 { margin-top: 0; color: #e11d48; }
        
        .content { padding: 15px; }
        .button-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
        .btn-3d { background-color: #b3e5fc; border: 2px solid #000; border-radius: 25px; padding: 10px; font-weight: 700; cursor: pointer; box-shadow: 0px 5px 0px #000; display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
        .btn-3d:active { transform: translateY(5px); box-shadow: 0px 0px 0px #000; }
        
        .products-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .product-card { background-color: #1a1b2e; border-radius: 12px; width: 100%; max-width: 280px; overflow: hidden; color: #fff; }
        .product-image { width: 100%; height: 140px; object-fit: cover; }
        .product-content { padding: 12px; }
        .product-title { font-size: 15px; font-weight: 700; margin: 0 0 10px 0; }
        .product-footer { display: flex; gap: 8px; align-items: center; }
        .product-price { background-color: #121322; padding: 8px; border-radius: 10px; font-size: 15px; font-weight: 700; flex: 1; color: #4ade80; text-align: center; }
        .buy-btn { background-color: #5d7aff; color: #fff; border: none; padding: 8px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

    <!-- Logo Profile ធ្លាក់ពីលើចំនួន ១០ គ្រាប់ -->
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">
    <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" class="falling-logo" alt="logo">

    <div class="header">
        <div class="logo-section">
            <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" alt="Logo" class="logo-img">
            <div>
                <div class="app-title">KAISENTZ</div>
                <div class="app-subtitle">SELL</div>
            </div>
        </div>
        <div class="menu-btn" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 id="userDisplay">ភ្ញៀវ</h3>
            <span class="close-sidebar" onclick="toggleSidebar()">✖</span>
        </div>
        <div class="sidebar-menu">
            <button onclick="openRegisterModal()">📝 បង្កើតគណនី</button>
            <button onclick="openLoginModal()">🔑 ចូលគណនី (Login)</button>
            <button onclick="logout()" id="logoutBtn" style="display:none; background:#e11d48;">🚪 ចាកចេញ</button>
            <button>🛒 ប្រវត្តិបញ្ជាទិញ</button>
            <a href="https://t.me/Prin_support" target="_blank">💬 ទាក់ទងអេតមីន</a>
        </div>
    </div>

    <!-- ផ្ទាំងបង្កើតគណនី (Register Modal) -->
    <div class="modal" id="registerModal">
        <div class="modal-header">
            <h3>បង្កើតគណនីថ្មី</h3>
            <span class="close-modal" onclick="closeModals()">✖</span>
        </div>
        <div class="input-group">
            <label>ឈ្មោះពិត (NAME)</label>
            <input type="text" id="regName" placeholder="បញ្ចូលឈ្មោះរបស់អ្នក">
        </div>
        <div class="input-group">
            <label>ឈ្មោះគណនី (USERNAME)</label>
            <input type="text" id="regUsername" placeholder="បញ្ចូលឈ្មោះសម្រាប់ Login">
        </div>
        <div class="input-group">
            <label>លេខសម្គាល់គណនី (ID)</label>
            <input type="text" id="autoID" disabled style="background:#272945; color:#4ade80; font-weight:bold;">
        </div>
        <div class="input-group">
            <label>លេខសម្ងាត់ (PASSWORD)</label>
            <input type="password" id="regPassword" placeholder="បញ្ចូលលេខសម្ងាត់">
        </div>
        <div class="input-group">
            <label>បញ្ជាក់លេខសម្ងាត់ (VERIFY PASSWORD)</label>
            <input type="password" id="regVerify" placeholder="បញ្ចូលលេខសម្ងាត់ម្ដងទៀត">
        </div>
        <button class="submit-btn" onclick="registerUser()">ចុះឈ្មោះ</button>
    </div>

    <!-- ផ្ទាំង Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-header">
            <h3>ចូលគណនី</h3>
            <span class="close-modal" onclick="closeModals()">✖</span>
        </div>
        <div class="input-group">
            <label>USERNAME</label>
            <input type="text" id="loginUser" placeholder="បញ្ចូល Username">
        </div>
        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="loginPass" placeholder="បញ្ចូល Password">
        </div>
        <button class="submit-btn" onclick="processLogin()">ចូល</button>
    </div>

    <!-- ផ្ទាំង Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <h3>👑 Admin Panel: ផុសទំនិញថ្មី</h3>
        <div class="input-group"><label>Link រូបភាព</label><input type="text" id="p_img" style="border:1px solid #ccc; background:#fff; color:#000;"></div>
        <div class="input-group"><label>ចំណងជើង</label><input type="text" id="p_title" style="border:1px solid #ccc; background:#fff; color:#000;"></div>
        <div class="input-group"><label>តម្លៃ</label><input type="text" id="p_price" style="border:1px solid #ccc; background:#fff; color:#000;"></div>
        <button class="submit-btn" style="background:#e11d48; color:#fff;" onclick="addNewProduct()">+ ផុសលក់ឥឡូវនេះ</button>
    </div>

    <div class="content">
        <div class="button-group">
            <button class="btn-3d" onclick="renderProducts()">
                <img src="https://img.sanishtech.com/u/fdd6da2d2e64441fb845d71317b85d5d.jpeg" class="roblox-icon" alt="Roblox"> 
                BLOX FRUIT
            </button>
        </div>
        <div class="products-container" id="productContainer"></div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('myProducts')) || [
            { img: 'https://img.sanishtech.com/u/2686cadce80ef1fdd79a01a6183e7017.png', title: '. LV 2807 + V3', price: '$1.25' }
        ];
        
        let users = JSON.parse(localStorage.getItem('myUsers')) || [];

        function renderProducts() {
            const container = document.getElementById("productContainer");
            container.innerHTML = ""; 
            products.forEach(p => {
                container.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" class="product-image">
                    <div class="product-content">
                        <h3 class="product-title">${p.title}</h3>
                        <div class="product-footer">
                            <div class="product-price">${p.price}</div>
                            <button class="buy-btn">ទិញឥឡូវនេះ</button>
                        </div>
                    </div>
                </div>`;
            });
        }
        renderProducts();

        function addNewProduct() {
            const img = document.getElementById('p_img').value;
            const title = document.getElementById('p_title').value;
            const price = document.getElementById('p_price').value;
            if(img && title && price) {
                products.push({ img, title, price });
                localStorage.setItem('myProducts', JSON.stringify(products));
                renderProducts();
                alert("បានផុសទំនិញថ្មីដោយជោគជ័យ!");
                document.getElementById('p_img').value = ""; document.getElementById('p_title').value = ""; document.getElementById('p_price').value = "";
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function closeModals() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('registerModal').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.getElementById('sidebar').classList.remove('active');
        }

        function openRegisterModal() {
            toggleSidebar();
            document.getElementById('registerModal').classList.add('active');
            document.getElementById('sidebarOverlay').classList.add('active');
            document.getElementById('regName').value = "";
            document.getElementById('regUsername').value = "";
            document.getElementById('regPassword').value = "";
            document.getElementById('regVerify').value = "";
            document.getElementById('autoID').value = 'KZN-' + Math.floor(100000 + Math.random() * 900000);
        }

        function openLoginModal() {
            toggleSidebar();
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function registerUser() {
            const name = document.getElementById('regName').value;
            const username = document.getElementById('regUsername').value;
            const pass = document.getElementById('regPassword').value;
            const verify = document.getElementById('regVerify').value;
            const id = document.getElementById('autoID').value;

            if(!name || !username || !pass || !verify) {
                alert("សូមបំពេញព័ត៌មានឲ្យបានគ្រប់គ្រាន់!"); return;
            }
            if(pass !== verify) {
                alert("ការបញ្ជាក់លេខសម្ងាត់មិនត្រឹមត្រូវទេ!"); return;
            }
            
            const existingUser = users.find(u => u.username === username);
            if(existingUser) {
                alert("ឈ្មោះគណនី (Username) នេះមានអ្នកប្រើប្រាស់ហើយ សូមប្តូរថ្មី!"); return;
            }

            users.push({ name, username, pass, id });
            localStorage.setItem('myUsers', JSON.stringify(users));
            alert("បង្កើតគណនីបានជោគជ័យ! លេខ ID របស់អ្នកគឺ: " + id);
            closeModals();
        }

        function processLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if(user === "kaisentzsellvip" && pass === "77779") {
                alert("សួស្តី Admin! អ្នកអាចផុសទំនិញបានហើយ។");
                document.getElementById('adminPanel').style.display = 'block';
                loginSuccess("👑 KAISENTZ VIP");
                return;
            }

            const foundUser = users.find(u => u.username === user && u.pass === pass);
            
            if(foundUser) {
                alert("សូមស្វាគមន៍ " + foundUser.name + "!");
                document.getElementById('adminPanel').style.display = 'none';
                loginSuccess("👤 " + foundUser.name);
            } else {
                alert("មិនមានគណនីនេះទេ! សូមពិនិត្យលេខសម្ងាត់ម្ដងទៀត ឬចុះឈ្មោះថ្មី។");
            }
        }

        function loginSuccess(displayName) {
            document.getElementById('userDisplay').innerText = displayName;
            document.getElementById('logoutBtn').style.display = 'block';
            closeModals();
        }

        function logout() {
            document.getElementById('userDisplay').innerText = "ភ្ញៀវ";
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginUser').value = "";
            document.getElementById('loginPass').value = "";
            alert("បានចាកចេញពីគណនីដោយជោគជ័យ!");
            toggleSidebar();
        }
    </script>
</body>
</html>
