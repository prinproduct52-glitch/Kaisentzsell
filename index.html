<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAISENTZ SELL</title>
    
    <!-- បញ្ចូល Font Poppins ពី Google Fonts ដើម្បីឲ្យអក្សរស្អាត -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services សម្រាប់ Login ជាមួយ Gmail -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* រចនាផ្ទៃទូទៅ */
        body {
            margin: 0;
            padding: 0;
            background-color: #0ba2b8; 
            font-family: 'Poppins', sans-serif; /* ប្រើប្រាស់ Font ថ្មី */
            color: #000;
        }

        /* រចនាផ្នែកខាងលើ (Header) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #0ba2b8;
            border-bottom: 2px solid #000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #000; /* បន្ថែមស៊ុមខ្មៅឲ្យរូប */
        }

        .app-title {
            font-size: 24px;
            font-weight: 900;
            color: #fff; 
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; 
            line-height: 1.1;
            letter-spacing: 1px;
        }
        
        .app-subtitle {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }

        /* រចនាប៊ូតុង 3D ទូទៅ */
        .btn-3d {
            background-color: #b3e5fc;
            border: 2px solid #000;
            border-radius: 25px;
            padding: 8px 15px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0px 5px 0px #000; /* ស្រមោល 3D */
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        /* ពេលចុចប៊ូតុងឲ្យវាផតចុះក្រោម */
        .btn-3d:active {
            transform: translateY(5px);
            box-shadow: 0px 0px 0px #000;
        }

        /* ប៊ូតុង Login ខាងលើ */
        .login-btn {
            background-color: #81d4fa;
            padding: 6px 10px 6px 15px;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .login-btn span.plus-icon {
            background-color: #000;
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            line-height: 1;
        }

        /* រចនាផ្នែកខាងក្រោម (Content) */
        .content {
            padding: 25px 15px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .game-btn {
            flex: 1;
            justify-content: center;
            background-color: #81d4fa;
            padding: 10px;
            font-size: 13px;
        }

        /* រចនារូប Logo Roblox ក្នុងប៊ូតុង */
        .roblox-icon {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            object-fit: cover;
        }
        
    </style>
</head>
<body>

    <!-- ផ្នែកខាងលើ (Header) -->
    <div class="header">
        <div class="logo-section">
            <!-- Link រូបភាព Profile ថ្មី -->
            <img src="https://img.sanishtech.com/u/aee6ebd5f38861f55f970b7e7111f6a1.png" alt="Logo" class="logo-img">
            <div>
                <div class="app-title">KAISENTZ</div>
                <div class="app-subtitle">SELL</div>
            </div>
        </div>
        
        <!-- ប៊ូតុង Login 3D -->
        <button class="btn-3d login-btn" onclick="triggerGoogleLogin()">
            Login <span class="plus-icon">+</span>
        </button>
    </div>

    <!-- ផ្នែកកណ្តាល (Account For Sell) -->
    <div class="content">
        <div class="section-title">🎮 Account For sell</div>
        
        <div class="button-group">
            <button class="btn-3d game-btn">
                <!-- Link រូបភាព Roblox ថ្មី -->
                <img src="https://img.sanishtech.com/u/fdd6da2d2e64441fb845d71317b85d5d.jpeg" class="roblox-icon" alt="Roblox"> 
                BLOX FRUIT
            </button>
            <button class="btn-3d game-btn">
                <img src="https://img.sanishtech.com/u/fdd6da2d2e64441fb845d71317b85d5d.jpeg" class="roblox-icon" alt="Roblox"> 
                STEAL AN EGG
            </button>
        </div>
    </div>

    <script>
        let tokenClient;

        // ដំឡើងប្រព័ន្ធ Google Login នៅពេលវេបសាយដើរពេញលេញ
        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                // ចំណាំ៖ អ្នកចាំបាច់ត្រូវប្តូរ ID នេះទៅជា Client ID របស់អ្នក ទើបវាដើរ 100%
                client_id: 'YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com',
                scope: 'email profile',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        alert("អ្នកបាន Login ដោយជោគជ័យ ជាមួយគណនី Gmail!");
                        
                        // ប្តូររូបរាងប៊ូតុងក្រោយពេល Login ជោគជ័យ
                        const loginBtn = document.querySelector('.login-btn');
                        loginBtn.innerHTML = 'Logged In ✓';
                        loginBtn.style.backgroundColor = '#a5d6a7';
                    }
                },
            });
        };

        // មុខងារសម្រាប់ដំណើរការពេលចុចប៊ូតុង Login
        function triggerGoogleLogin() {
            if (tokenClient) {
                // ហៅផ្ទាំង Popup របស់ Google ឲ្យលោតឡើង
                tokenClient.requestAccessToken();
            } else {
                alert("សូមរង់ចាំបន្តិច! ប្រព័ន្ធកំពុងដំណើរការ...");
            }
        }
    </script>
</body>
</html>
